version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mws
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # smtp
      - "8025:8025"   # web ui

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailpit
    env_file:
      - .env
    volumes:
      - ./backend:/app

  worker-email:
    build: ./backend
    command: python -m app.workers.email_worker
    depends_on:
      - postgres
      - redis
      - mailpit
    env_file:
      - .env
    volumes:
      - ./backend:/app

  worker-jobs:
    build: ./backend
    command: python -m app.workers.job_worker
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - ./backend:/app

volumes:
  pgdata:
